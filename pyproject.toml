[project]
name = "march-madness-predictor"
version = "0.1.0"
description = "March Madness tournament predictor"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "kaggle>=2.0.0",
]

[tool.setuptools]
py-modules = ["mm_predict"]

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
mm-predict = "mm_predict:main"
